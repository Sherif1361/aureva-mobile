<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Aureva">
  <meta name="description" content="مكتب Aureva لإدارة الإقامات على الموبايل">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="stylesheet" href="./style.css">
  <title>Aureva Desk</title>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">A</span><span><strong>Aureva</strong><small>Desk</small></span></div>
      <span id="mode" class="mode">على الجهاز</span>
    </header>
    <main id="main" aria-live="polite"></main>
    <nav class="tabbar" aria-label="القائمة الرئيسية">
      <button type="button" data-tab="today" aria-label="اليوم"><span class="ico">◫</span><span>اليوم</span></button>
      <button type="button" data-tab="stays" aria-label="الحجوزات"><span class="ico">▦</span><span>الحجوزات</span></button>
      <button type="button" data-tab="flats" aria-label="الشقق"><span class="ico">⌂</span><span>الشقق</span></button>
      <button type="button" data-tab="settings" aria-label="الإعدادات"><span class="ico">⚙</span><span>الإعدادات</span></button>
    </nav>
  </div>
  <input id="import-file" type="file" accept=".json,application/json" hidden>
  <script src="./app.js" defer></script>
</body>
</html>
