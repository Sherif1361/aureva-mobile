<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Aureva">
  <meta name="description" content="مكتب Aureva لإدارة الإقامات على الموبايل">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="stylesheet" href="./style.css?v=10">
  <title>Aureva Desk</title>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">A</span><span><strong>Aureva</strong><small>Desk</small></span></div>
      <button id="mode" type="button" class="mode" data-action="refresh" aria-label="تحديث بيانات الحجوزات">نسخة الجهاز</button>
    </header>
    <main id="main" aria-live="polite"></main>
    <nav class="tabbar" aria-label="القائمة الرئيسية">
      <button type="button" data-tab="today" aria-label="اليوم"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5M5 9.5V21h14V9.5M9 21v-7h6v7"/></svg></span><span>اليوم</span></button>
      <button type="button" data-tab="stays" aria-label="الحجوزات"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 14h3M8 17h7"/></svg></span><span>الحجوزات</span></button>
      <button type="button" data-tab="flats" aria-label="الشقق"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v16M2 21h20M8 7h2M14 7h2M8 11h2M14 11h2M9 21v-5h6v5"/></svg></span><span>الشقق</span></button>
      <button type="button" data-tab="settings" aria-label="الإعدادات"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/><circle cx="12" cy="12" r="5"/></svg></span><span>الإعدادات</span></button>
    </nav>
  </div>
  <input id="import-file" type="file" accept=".json,application/json" hidden>
  <input id="connection-file" type="file" accept=".json,application/json" hidden>
  <script src="./live.js?v=10" defer></script>
  <script src="./app.js?v=10" defer></script>
</body>
</html>
